<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - PubHealthQA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="https://www.uit.edu.vn/sites/vi/files/favicon.ico" type="image/vnd.microsoft.icon">
    <style>
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .auth-form {
            padding: 3rem;
        }
        .form-control {
            border-radius: 15px;
            border: 2px solid #e9ecef;
            padding: 0.8rem 1.2rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-auth {
            border-radius: 15px;
            padding: 0.8rem 2rem;
            font-weight: 500;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            transition: all 0.3s ease;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .logo-section {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 20px 0 0 20px;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 5px;
            background-color: #e9ecef;
            transition: all 0.3s ease;
        }
        .password-strength.weak { background-color: #dc3545; }
        .password-strength.medium { background-color: #ffc107; }
        .password-strength.strong { background-color: #28a745; }
        @media (max-width: 768px) {
            .logo-section {
                border-radius: 20px 20px 0 0;
            }
            .auth-form {
                padding: 2rem;
            }
        }
    </style>
</head>
<body class="auth-container d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="auth-card">
                    <div class="row g-0">
                        <!-- Logo Section -->
                        <div class="col-md-6 logo-section d-flex align-items-center justify-content-center text-white p-5">
                            <div class="text-center">
                                <i class="bi bi-heart-pulse" style="font-size: 4rem;"></i>
                                <h2 class="mt-3 mb-3">PubHealthQA</h2>
                                <p class="fs-5 mb-4">Trợ lý Sức khỏe Công cộng</p>
                                <p class="opacity-75">Tạo tài khoản để trải nghiệm đầy đủ các tính năng của hệ thống</p>
                            </div>
                        </div>
                        
                        <!-- Register Form -->
                        <div class="col-md-6">
                            <div class="auth-form">
                                <h3 class="text-center mb-4 text-primary">Đăng ký tài khoản</h3>
                                
                                <div id="alert-container"></div>
                                
                                <form id="register-form">
                                    <div class="mb-3">
                                        <label for="full_name" class="form-label">Họ và tên</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0" style="border-radius: 15px 0 0 15px;">
                                                <i class="bi bi-person"></i>
                                            </span>
                                            <input type="text" class="form-control border-start-0" id="full_name" name="full_name" 
                                                   placeholder="Nhập họ và tên" required style="border-radius: 0 15px 15px 0;">
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0" style="border-radius: 15px 0 0 15px;">
                                                <i class="bi bi-envelope"></i>
                                            </span>
                                            <input type="email" class="form-control border-start-0" id="email" name="email" 
                                                   placeholder="Nhập địa chỉ email" required style="border-radius: 0 15px 15px 0;">
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Mật khẩu</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0" style="border-radius: 15px 0 0 15px;">
                                                <i class="bi bi-lock"></i>
                                            </span>
                                            <input type="password" class="form-control border-start-0" id="password" name="password" 
                                                   placeholder="Nhập mật khẩu" required style="border-radius: 0 15px 15px 0;">
                                        </div>
                                        <div class="password-strength" id="password-strength"></div>
                                        <div class="small text-muted mt-1">Mật khẩu phải có ít nhất 6 ký tự</div>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label for="confirm_password" class="form-label">Xác nhận mật khẩu</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0" style="border-radius: 15px 0 0 15px;">
                                                <i class="bi bi-lock-fill"></i>
                                            </span>
                                            <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" 
                                                   placeholder="Nhập lại mật khẩu" required style="border-radius: 0 15px 15px 0;">
                                        </div>
                                        <div class="invalid-feedback" id="password-mismatch" style="display: none;">
                                            Mật khẩu xác nhận không khớp
                                        </div>
                                    </div>
                                    
                                    <div class="d-grid mb-3">
                                        <button type="submit" class="btn btn-primary btn-auth" id="register-btn">
                                            <i class="bi bi-person-plus me-2"></i>Đăng ký
                                        </button>
                                    </div>
                                </form>
                                
                                <div class="text-center">
                                    <p class="mb-0">Đã có tài khoản? 
                                        <a href="/login" class="text-primary text-decoration-none fw-medium">Đăng nhập ngay</a>
                                    </p>
                                </div>
                                
                                <hr class="my-4">
                                
                                <div class="text-center">
                                    <p class="text-muted small mb-0">
                                        <a href="/" class="text-decoration-none">
                                            <i class="bi bi-arrow-left me-1"></i>Quay lại trang chủ
                                        </a>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('password-strength');
            
            let strength = 0;
            if (password.length >= 6) strength += 1;
            if (password.match(/[a-z]/)) strength += 1;
            if (password.match(/[A-Z]/)) strength += 1;
            if (password.match(/[0-9]/)) strength += 1;
            if (password.match(/[^a-zA-Z0-9]/)) strength += 1;
            
            strengthBar.className = 'password-strength';
            if (strength < 3) {
                strengthBar.classList.add('weak');
            } else if (strength < 4) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
        });
        
        // Password confirmation validation
        function validatePasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const mismatchDiv = document.getElementById('password-mismatch');
            const confirmInput = document.getElementById('confirm_password');
            
            if (confirmPassword && password !== confirmPassword) {
                confirmInput.classList.add('is-invalid');
                mismatchDiv.style.display = 'block';
                return false;
            } else {
                confirmInput.classList.remove('is-invalid');
                mismatchDiv.style.display = 'none';
                return true;
            }
        }
        
        document.getElementById('confirm_password').addEventListener('input', validatePasswordMatch);
        document.getElementById('password').addEventListener('input', function() {
            if (document.getElementById('confirm_password').value) {
                validatePasswordMatch();
            }
        });
        
        // Form submission
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!validatePasswordMatch()) {
                return;
            }
            
            const fullName = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const registerBtn = document.getElementById('register-btn');
            const alertContainer = document.getElementById('alert-container');
            
            // Clear previous alerts
            alertContainer.innerHTML = '';
            
            // Show loading state
            registerBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Đang xử lý...';
            registerBtn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Show success message
                    alertContainer.innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle me-2"></i>Đăng ký thành công! Đang chuyển hướng đến trang đăng nhập...
                        </div>
                    `;
                    
                    // Redirect to login page
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // Show error message
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle me-2"></i>${data.detail || 'Đăng ký thất bại'}
                        </div>
                    `;
                }
            } catch (error) {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle me-2"></i>Có lỗi xảy ra. Vui lòng thử lại.
                    </div>
                `;
            } finally {
                // Reset button
                registerBtn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Đăng ký';
                registerBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
